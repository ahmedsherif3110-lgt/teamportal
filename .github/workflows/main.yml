name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/teamportal/app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'TeamPortal'
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.teamportal.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.teamportal.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.12.1'
              implementation 'com.google.firebase:firebase-messaging:24.1.0'
          }
          EOF

          cp android/app/google-services.json android/app/google-services.json
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp MainActivity.java android/app/src/main/java/com/teamportal/app/MainActivity.java
          cp TeamFirebaseMessagingService.java android/app/src/main/java/com/teamportal/app/TeamFirebaseMessagingService.java
          cp styles.xml android/app/src/main/res/values/styles.xml
          cp icon-192.png android/app/src/main/res/drawable/icon_192.png
          cp icon-512.png android/app/src/main/res/drawable/icon_512.png

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: TeamPortal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
